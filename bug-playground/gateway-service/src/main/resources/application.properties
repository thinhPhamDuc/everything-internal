server.port=8080
spring.application.name=gateway-service

# --- Bug #4a: Routing ---
# BUG mac dinh: payment-target trỏ NHẦM sang order-service (lỗi copy-paste
# route thật) -> mọi request /api/payments/** bị forward sai chỗ, order-service
# không có endpoint đó -> 404. Sửa: set env GATEWAY_PAYMENT_TARGET_URL đúng
# về payment-service.
gateway.order-service.url=${ORDER_SERVICE_URL:http://order-service:8080}
gateway.payment-target.url=${GATEWAY_PAYMENT_TARGET_URL:http://order-service:8080}

# --- Bug #4b: CORS ---
# BUG mac dinh: chỉ cho phép 1 origin không tồn tại gọi vào -> browser chặn
# request từ cors-test-client/index.html (mở qua origin thật, VD
# http://localhost:5500). Sửa: set env GATEWAY_CORS_ALLOWED_ORIGIN đúng
# origin của client thật.
gateway.cors.allowed-origin=${GATEWAY_CORS_ALLOWED_ORIGIN:http://localhost:9999}

# --- Bug #3: Distributed Tracing ---
# false (mặc định) = KHÔNG forward correlation id sang downstream (BUG).
# true = forward -> so sánh trong Kibana bằng cách filter correlation_id.
tracing.propagate.enabled=${TRACING_PROPAGATE_ENABLED:false}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.com.app.playground=INFO
