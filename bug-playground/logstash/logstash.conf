input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # LogstashEncoder đã gửi field @timestamp/level/logger_name/message/service/
  # correlation_id sẵn dạng JSON phẳng - không cần parse thêm gì ở đây.
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "playground-logs-%{+YYYY.MM.dd}"
  }
  # Bật dòng dưới lúc debug nếu log không thấy lên Kibana - xem thẳng stdout
  # container logstash để biết Logstash có nhận được message không.
  # stdout { codec => rubydebug }
}
