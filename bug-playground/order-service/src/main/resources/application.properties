server.port=8080
spring.application.name=order-service

# --- MySQL dùng chung (thay ConcurrentHashMap) - để scale nhiều instance an toàn ---
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:mysql}:3306/playground_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=playground_user
spring.datasource.password=playground_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Cố ý để nhỏ - Tomcat mặc định max=200 sẽ khó cạn trong demo local. Với 10
# thread, chỉ cần ~15-20 request đồng thời (xem README kịch bản Bug #1) là
# đủ khiến order-service ngừng nhận MỌI request khác.
server.tomcat.threads.max=10

# --- Bug #1: Cascading Failure ---
payment.service.base-url=${PAYMENT_SERVICE_URL:http://payment-service:8080}
payment.client.connect-timeout-ms=${PAYMENT_CLIENT_CONNECT_TIMEOUT_MS:5000}
# 0 = KHONG co timeout (BUG mac dinh). Sửa: set > 0 (VD 3000) để thread được
# giải phóng đúng hạn thay vì treo theo tốc độ payment-service.
payment.client.read-timeout-ms=${PAYMENT_CLIENT_READ_TIMEOUT_MS:0}

# --- Bug #2: Data Inconsistency (qua Kafka, xem PaymentCompletedListener) ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.app.playground.order.event
# Producer (payment-service) không gửi type header (__TypeId__) vì 2 service
# không share class - ép deserializer luôn dùng class nội bộ của order-service.
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.app.playground.order.event.PaymentCompletedEvent

# --- Bug #3: Distributed Tracing ---
tracing.propagate.enabled=${TRACING_PROPAGATE_ENABLED:false}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.com.app.playground=INFO
