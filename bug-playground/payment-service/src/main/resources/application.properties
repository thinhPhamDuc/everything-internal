server.port=8080
spring.application.name=payment-service

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Không gửi __TypeId__ header - order-service dùng class nội bộ riêng của nó
# (spring.json.value.default.type), không phụ thuộc FQCN bên payment-service.
spring.kafka.producer.properties.spring.json.add.type.headers=false

tracing.propagate.enabled=${TRACING_PROPAGATE_ENABLED:false}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.com.app.playground=INFO
