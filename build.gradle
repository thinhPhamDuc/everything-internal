plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.app'
version = '0.0.1-SNAPSHOT'
description = 'everything-internal'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    // 1. Spring Boot Starter Security (Bảo mật)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // 2. Spring Boot Starter Validation (Xác thực dữ liệu đầu vào)
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // 3. JJWT (Java JWT) - Thư viện hỗ trợ tạo và giải mã JWT
    // Thay '0.12.5' bằng phiên bản mới nhất hiện tại nếu cần
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    // 4. Spring AMQP (RabbitMQ) - xử lý bất đồng bộ qua message queue
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    // 5. Spring Security Test - cho @WithMockUser trong test @PreAuthorize
    testImplementation 'org.springframework.security:spring-security-test'
    // 6. Spring Batch (Task 5) - xử lý staging -> Inventory theo chunk, tự
    // tạo bảng BATCH_JOB_INSTANCE/BATCH_JOB_EXECUTION... khi app khởi động
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    testImplementation 'org.springframework.batch:spring-batch-test'
    // 7. Spring Data Redis (Task 6 Phase B) - cache kết quả search, dùng
    // Lettuce client mặc định đi kèm.
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // 8. Observability (Task 8) - Actuator expose /actuator/prometheus,
    // Micrometer Tracing (Brave) sinh traceId/spanId + gửi trace sang Tempo
    // qua giao thức Zipkin. Version của các dòng dưới do Spring Boot BOM quản
    // lý (giống jjwt là ngoại lệ cần khai version tay vì không nằm trong BOM).
    //
    // LƯU Ý Spring Boot 4.x: autoconfigure đã tách module rất nhỏ (xem
    // https://spring.io/blog/2025/10/28/modularizing-spring-boot/) -
    // spring-boot-starter-actuator KHÔNG còn tự kéo theo autoconfiguration
    // tracing/zipkin như Boot 3.x nữa, phải khai rõ 2 module dưới, nếu không
    // toàn bộ management.tracing.*/management.zipkin.* sẽ bị lờ đi lặng lẽ
    // (không lỗi, chỉ đơn giản là traceId/spanId không bao giờ xuất hiện).
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    implementation 'io.zipkin.reporter2:zipkin-reporter-brave'
    implementation 'org.springframework.boot:spring-boot-micrometer-tracing'
    implementation 'org.springframework.boot:spring-boot-micrometer-tracing-brave'
    implementation 'org.springframework.boot:spring-boot-zipkin'
    // datasource-proxy: log từng câu SQL + đánh dấu WARN khi vượt ngưỡng chậm
    // (xem DataSourceProxyConfig) - không nằm trong Spring Boot BOM nên cần
    // khai version tay.
    implementation 'net.ttddyy:datasource-proxy:1.11.0'
    // logstash-logback-encoder: xuất log dạng JSON (kèm MDC traceId/spanId)
    // ra file để Promtail đọc và đẩy vào Loki.
    implementation 'net.logstash.logback:logstash-logback-encoder:9.0'
    // 9. Test cho ThirdPartyFlightFetchServiceTest (Task 9) - dựng 1 HttpServer
    // JDK thật để trả JSON giả lập provider. jackson-databind/jsr310 CHẠY
    // ĐƯỢC ở runtime app (webmvc kéo theo gián tiếp) nhưng Spring Boot 4.x
    // không expose 2 artifact này ở COMPILE classpath cho code tự viết import
    // trực tiếp - phải khai tay (version do Spring Boot Jackson BOM quản lý).
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
    testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
}

tasks.named('test') {
    useJUnitPlatform()
}
