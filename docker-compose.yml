# docker-compose.yml — hạ tầng dev cho dự án "Airline Ticket Management"
#
# Mục đích: chỉ dựng các service HẠ TẦNG (MySQL, RabbitMQ, Redis) bằng Docker,
# còn Spring Boot app thì bạn vẫn chạy trực tiếp bằng IDE / `./gradlew bootRun`
# để dev nhanh (hot reload, debug). Khi nào muốn containerize luôn cả app,
# ta sẽ thêm Dockerfile + service "app" ở một bước sau (Task 0 mở rộng).
#
# Cách dùng:
#   docker compose up -d        # chạy nền
#   docker compose ps           # xem trạng thái
#   docker compose logs -f      # xem log
#   docker compose down         # tắt (thêm -v nếu muốn xoá luôn volume/data)

services:
  mysql:
    image: mysql:8.4
    container_name: airline-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: airline_db
      MYSQL_USER: airline_user
      MYSQL_PASSWORD: airline_pass
      MYSQL_ROOT_PASSWORD: airline_root_pass
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+00:00
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "airline_user", "-pairline_pass"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - airline-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: airline-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: airline_mq
      RABBITMQ_DEFAULT_PASS: airline_mq_pass
    ports:
      - "5672:5672"   # AMQP protocol — app kết nối vào đây
      - "15672:15672" # Management UI — mở http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - airline-net

  redis:
    image: redis:7-alpine
    container_name: airline-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379" # search cache (Task 6 Phase B) - app kết nối vào đây
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - airline-net

volumes:
  mysql_data:
  rabbitmq_data:
  redis_data:

networks:
  airline-net:
    driver: bridge

# ─────────────────────────────────────────────────────────────
# Cấu hình tương ứng trong src/main/resources/application.properties
# (cấu hình tương ứng trong application.properties):
#
# spring.datasource.url=jdbc:mysql://localhost:3306/airline_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
# spring.datasource.username=airline_user
# spring.datasource.password=airline_pass
#
# spring.rabbitmq.host=localhost
# spring.rabbitmq.port=5672
# spring.rabbitmq.username=airline_mq
# spring.rabbitmq.password=airline_mq_pass
#
# spring.data.redis.host=localhost
# spring.data.redis.port=6379
# ─────────────────────────────────────────────────────────────
