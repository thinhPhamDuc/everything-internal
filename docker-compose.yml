# docker-compose.yml — hạ tầng dev cho dự án "Airline Ticket Management"
#
# Mục đích: chỉ dựng các service HẠ TẦNG (MySQL, RabbitMQ, Redis) bằng Docker,
# còn Spring Boot app thì bạn vẫn chạy trực tiếp bằng IDE / `./gradlew bootRun`
# để dev nhanh (hot reload, debug). Khi nào muốn containerize luôn cả app,
# ta sẽ thêm Dockerfile + service "app" ở một bước sau (Task 0 mở rộng).
#
# Cách dùng:
#   docker compose up -d        # chạy nền
#   docker compose ps           # xem trạng thái
#   docker compose logs -f      # xem log
#   docker compose down         # tắt (thêm -v nếu muốn xoá luôn volume/data)

services:
  mysql:
    image: mysql:8.4
    container_name: airline-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: airline_db
      MYSQL_USER: airline_user
      MYSQL_PASSWORD: airline_pass
      MYSQL_ROOT_PASSWORD: airline_root_pass
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+00:00
      --slow_query_log=1
      --slow_query_log_file=/var/lib/mysql/slow.log
      --long_query_time=0.5
      --log_output=FILE
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "airline_user", "-pairline_pass"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - airline-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: airline-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: airline_mq
      RABBITMQ_DEFAULT_PASS: airline_mq_pass
    ports:
      - "5672:5672"   # AMQP protocol — app kết nối vào đây
      - "15672:15672" # Management UI — mở http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - airline-net

  redis:
    image: redis:7-alpine
    container_name: airline-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379" # search cache (Task 6 Phase B) - app kết nối vào đây
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - airline-net

  # ── Task 8: Observability (Prometheus + Loki + Tempo + Grafana) ──────────
  # App vẫn chạy trên host (không containerize) - Prometheus/Promtail đọc dữ
  # liệu từ host qua host.docker.internal / bind-mount thư mục ./logs, xem
  # infra/observability/*.
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: airline-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway" # cần cho Linux, macOS/Windows đã có sẵn
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090" # Prometheus UI — http://localhost:9090
    networks:
      - airline-net

  loki:
    image: grafana/loki:3.3.0
    container_name: airline-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./infra/observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - airline-net

  promtail:
    image: grafana/promtail:3.3.0
    container_name: airline-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./infra/observability/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      # App ghi JSON log ra ./logs/app.log (xem logback-spring.xml) - mount
      # đúng thư mục đó vào container để Promtail tail được (app không chạy
      # trong container nên không scrape qua Docker socket như bình thường).
      - ./logs:/var/log/app:ro
    depends_on:
      - loki
    networks:
      - airline-net

  tempo:
    image: grafana/tempo:2.6.1
    container_name: airline-tempo
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./infra/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "9411:9411" # Zipkin-compatible ingest — app gửi trace vào đây
      - "3200:3200" # Tempo API — Grafana query qua đây
    networks:
      - airline-net

  grafana:
    image: grafana/grafana:11.4.0
    container_name: airline-grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      # Bật tính năng correlation Tempo -> Loki/Prometheus (traceToLogs,
      # traceToMetrics, serviceMap) dùng trong datasources.yml.
      GF_FEATURE_TOGGLES_ENABLE: "traceqlSearch correlations"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000" # Grafana UI — http://localhost:3000
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - airline-net

volumes:
  mysql_data:
  rabbitmq_data:
  redis_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:

networks:
  airline-net:
    driver: bridge

# ─────────────────────────────────────────────────────────────
# Cấu hình tương ứng trong src/main/resources/application.properties
# (cấu hình tương ứng trong application.properties):
#
# spring.datasource.url=jdbc:mysql://localhost:3306/airline_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
# spring.datasource.username=airline_user
# spring.datasource.password=airline_pass
#
# spring.rabbitmq.host=localhost
# spring.rabbitmq.port=5672
# spring.rabbitmq.username=airline_mq
# spring.rabbitmq.password=airline_mq_pass
#
# spring.data.redis.host=localhost
# spring.data.redis.port=6379
# ─────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────
# Task 8 (Observability) — không cần thêm gì vào application.properties để
# CHẠY 4 container này (Prometheus/Loki/Promtail/Tempo/Grafana không phải
# datasource của app) - riêng phần app GỬI DỮ LIỆU sang chúng đã cấu hình sẵn
# trong application.properties (management.endpoints.web.exposure.include,
# management.zipkin.tracing.endpoint...). Chỉ cần:
#   mkdir -p logs   # trước khi bootRun lần đầu, để bind-mount ./logs không
#                   # bị Docker tự tạo với quyền root
#
# UI truy cập sau khi `docker compose up -d`:
#   Grafana:    http://localhost:3000       (anonymous admin, chỉ cho dev)
#   Prometheus: http://localhost:9090
#   Tempo API:  http://localhost:3200
# ─────────────────────────────────────────────────────────────
