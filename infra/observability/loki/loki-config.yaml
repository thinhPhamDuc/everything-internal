# Task 8 (Observability) - Loki, bản single-binary tối giản cho dev (lưu
# local filesystem, không cần S3/object storage thật).
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Cho phép ingest log hơi "trễ" (VD app buffer/flush chậm) mà không bị Loki
  # từ chối - chỉ áp dụng cho dev, không cần tối ưu ở đây.
  reject_old_samples: false
