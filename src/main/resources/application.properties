spring.application.name=everything-internal
spring.datasource.url=jdbc:postgresql://localhost:5432/airline_db
spring.datasource.username=airline_user
spring.datasource.password=airline_pass

# Chỉ dùng update ở local dev để Hibernate tự tạo/sửa bảng theo entity.
# Khi có Flyway/Liquibase (nên thêm sau), đổi thành "validate" hoặc bỏ hẳn dòng này.
spring.jpa.hibernate.ddl-auto=update

# Task 3: cần 2 dòng dưới để data.sql seed Role/Permission chạy đúng với
# Postgres (không phải DB embedded - mặc định Spring Boot chỉ tự chạy data.sql
# cho DB embedded), và chạy SAU khi Hibernate đã tạo xong bảng theo entity
# (mặc định data.sql chạy TRƯỚC, sẽ lỗi vì bảng roles/permissions chưa tồn tại).
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=airline_mq
spring.rabbitmq.password=airline_mq_pass

app.jwt.secret=9a8b7c6d5e4f3g2h1i0jK@lMnOpQrStUvWxYz1234567890abcdefGHIJKLMNOP
app.jwt.expiration-ms=3600000

# Task 5: lúc dev để ngắn (mỗi 3 phút) test nhanh, thay vì đợi thật tới 12h
# trưa - nhớ đổi thành "0 0 12 * * *" trước khi coi Task 5 là "xong".
app.sync.cron=0 */3 * * * *
app.sync.mock-api-url=http://localhost:8080/mock/third-party/flights

# Spring Boot Batch mặc định TỰ CHẠY Job lúc app khởi động (khi chỉ có 1
# Job bean) - flightImportJob PHẢI được gọi tay bởi Consumer#2 (Bước 10)
# với đúng jobParameters batchId, không phải chạy tự động lúc start app.
spring.batch.job.enabled=false

# Task 6 Phase B: timeout kết nối NGẮN bắt buộc - Redis chết không được
# kéo chậm luôn request search (search vẫn phải trả được kết quả từ
# Postgres, xem SearchCacheService).
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=500ms
spring.data.redis.lettuce.shutdown-timeout=200ms

# TTL cache search theo bậc daysToDeparture (xem SearchCacheService.resolveTtl):
# tier-thresholds-days=1,7,30 chia thành 4 bậc [0-1][2-7][8-30][>30], mỗi bậc
# tương ứng 1 giá trị trong tier-ttl-seconds. jitter-percent chống cache
# stampede (nhiều key cùng bậc hết hạn đồng loạt).
app.search-cache.tier-thresholds-days=1,7,30
app.search-cache.tier-ttl-seconds=30,120,600,1800
app.search-cache.jitter-percent=15
