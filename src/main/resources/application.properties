spring.application.name=everything-internal
spring.datasource.url=jdbc:mysql://localhost:3306/airline_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=airline_user
spring.datasource.password=airline_pass

# Chỉ dùng update ở local dev để Hibernate tự tạo/sửa bảng theo entity.
# Khi có Flyway/Liquibase (nên thêm sau), đổi thành "validate" hoặc bỏ hẳn dòng này.
spring.jpa.hibernate.ddl-auto=update

# Task 3: cần 2 dòng dưới để data.sql seed Role/Permission chạy đúng với
# MySQL (không phải DB embedded - mặc định Spring Boot chỉ tự chạy data.sql
# cho DB embedded), và chạy SAU khi Hibernate đã tạo xong bảng theo entity
# (mặc định data.sql chạy TRƯỚC, sẽ lỗi vì bảng roles/permissions chưa tồn tại).
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=airline_mq
spring.rabbitmq.password=airline_mq_pass

app.jwt.secret=9a8b7c6d5e4f3g2h1i0jK@lMnOpQrStUvWxYz1234567890abcdefGHIJKLMNOP
app.jwt.expiration-ms=3600000

# Task 5: lúc dev để ngắn (mỗi 3 phút) test nhanh, thay vì đợi thật tới 12h
# trưa - nhớ đổi thành "0 0 12 * * *" trước khi coi Task 5 là "xong".
app.sync.cron=0 */3 * * * *
app.sync.mock-api-url=http://localhost:8080/mock/third-party/flights

# Spring Boot Batch mặc định TỰ CHẠY Job lúc app khởi động (khi chỉ có 1
# Job bean) - flightImportJob PHẢI được gọi tay bởi Consumer#2 (Bước 10)
# với đúng jobParameters batchId, không phải chạy tự động lúc start app.
spring.batch.job.enabled=false

# Task 6 Phase B: timeout kết nối NGẮN bắt buộc - Redis chết không được
# kéo chậm luôn request search (search vẫn phải trả được kết quả từ
# MySQL, xem SearchCacheService).
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=500ms
spring.data.redis.lettuce.shutdown-timeout=200ms

# TTL cache search theo bậc daysToDeparture (xem SearchCacheService.resolveTtl):
# tier-thresholds-days=1,7,30 chia thành 4 bậc [0-1][2-7][8-30][>30], mỗi bậc
# tương ứng 1 giá trị trong tier-ttl-seconds. jitter-percent chống cache
# stampede (nhiều key cùng bậc hết hạn đồng loạt).
app.search-cache.tier-thresholds-days=1,7,30
app.search-cache.tier-ttl-seconds=30,120,600,1800
app.search-cache.jitter-percent=15

# Task 7: giữ chỗ PENDING tối đa bao lâu trước khi bị coi là hết hạn, và tần
# suất BookingExpiryScheduler quét - mỗi phút đủ nhanh cho cả dev lẫn thực tế
# (không giống app.sync.cron, khoảng này không cần đổi trước "production").
app.booking.hold-minutes=15
app.booking.expiry-cron=0 * * * * *

# Task 8: Observability - Actuator/Prometheus/Tracing (xem GIAO_AN.md Task 8).
# Chỉ expose health/info/prometheus, KHÔNG expose "*" (tránh lộ endpoint quản
# trị nhạy cảm như /actuator/env, /actuator/heapdump ra ngoài).
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized

# Sampling 100% ở dev để không bỏ lỡ trace nào lúc mới quan sát hệ thống - hạ
# xuống (VD 0.1) khi lên production thật để giảm tải/chi phí lưu trữ trace.
management.tracing.sampling.probability=1.0
# Tempo nhận trace theo giao thức Zipkin ở port 9411 (xem infra/observability).
# LƯU Ý: property này đổi tên ở Spring Boot 4.x - bản Boot 3.x cũ là
# "management.zipkin.tracing.endpoint" (nhiều bài viết/tài liệu cũ vẫn ghi
# tên cũ, dùng nhầm sẽ bị lờ đi lặng lẽ, không báo lỗi).
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans

# Bật observation cho RabbitTemplate + Simple Listener Container để 1 traceId
# đi xuyên suốt qua RabbitMQ: Scheduler publish -> Consumer#1 -> Consumer#2 ->
# Batch job, thay vì mỗi bước có traceId rời rạc (quan trọng cho Task 5/9/10).
spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.simple.observation-enabled=true

# Ngưỡng coi 1 câu SQL là "chậm" - đọc bởi DataSourceProxyConfig, log ra ở mức
# WARN kèm traceId/spanId của request/consumer đang chạy khi vượt ngưỡng này.
app.observability.slow-query-threshold-ms=200
